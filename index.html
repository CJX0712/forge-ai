<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晨星旗舰 AI · Forge AI 自检驾驶舱</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#ffffff; --line:#e3e6ea; --text:#14181f; --muted:#6b7280;
    --accent:#1d4ed8; --ok:#0f9d58; --bad:#d93025; --chip:#eef2ff; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
       -webkit-font-smoothing:antialiased;line-height:1.6}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 64px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:14px}
  .author{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--accent);
          border:1px solid #dbe3ff;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
  .arch{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 4px}
  .chip{font-size:11.5px;padding:4px 9px;border-radius:6px;background:#fff;border:1px solid var(--line);color:var(--muted)}
  .chip.on{background:#0f9d58;border-color:#0f9d58;color:#fff;font-weight:600}
  .chip.half{background:#fff7e6;border-color:#f5d78e;color:#8a6100}
  .bar{display:flex;align-items:center;gap:12px;margin:22px 0 6px;flex-wrap:wrap}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;
         cursor:pointer;box-shadow:0 1px 2px rgba(29,78,216,.25)}
  button:hover{background:#1a43b8}
  button:disabled{opacity:.6;cursor:progress}
  .hint{font-size:12.5px;color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 22px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:24px;font-weight:700;margin-top:2px;font-family:var(--mono)}
  .badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700}
  .badge.ok{background:#e6f4ea;color:var(--ok)}
  .badge.bad{background:#fce8e6;color:var(--bad)}
  .mod{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .mod>.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .mod>.hd .t{font-weight:700;font-size:14.5px}
  .mod>.hd .m{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:9px 16px;border-top:1px solid #f0f2f4}
  td.n{color:var(--text)}
  td.v{font-family:var(--mono);text-align:right;white-space:nowrap;width:120px}
  td.t{font-family:var(--mono);text-align:right;white-space:nowrap;width:110px;color:var(--muted)}
  td.s{width:34px;text-align:center}
  tr.pending td{color:var(--muted)}
  footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  code{font-family:var(--mono);background:#f1f3f5;padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>晨星旗舰 AI · Forge AI 自检驾驶舱</h1>
      <div class="sub">零依赖单文件算法内核 · 浏览器内一键全检 · 硬不变量可独立交叉验证</div>
    </div>
    <span class="author">✦ 作者：晨星（CJX0712）</span>
  </header>

  <div class="arch" id="arch"></div>

  <div class="bar">
    <button id="run">▶ 一键全检</button>
    <span class="hint" id="status">等待运行…（全部计算在浏览器本地完成，无任何网络请求）</span>
  </div>

  <div class="cards">
    <div class="stat"><div class="k">模块通过</div><div class="v" id="s-mod">—</div></div>
    <div class="stat"><div class="k">检查项通过</div><div class="v" id="s-chk">—</div></div>
    <div class="stat"><div class="k">总体状态</div><div class="v" id="s-all">—</div></div>
  </div>

  <div id="list"></div>

  <footer>
    十层分解架构 L0–L9 · MIT License · 作者：晨星（CJX0712）<br>
    命令行等价验证：<code>node src/test-runner.js</code>
  </footer>
</div>

<script src="src/math-forge.js"></script>
<script src="src/linreg-forge.js"></script>
<script src="src/logreg-forge.js"></script>
<script src="src/tree-forge.js"></script>
<script src="src/pca-forge.js"></script>
<script src="src/kmeans-forge.js"></script>
<script src="src/gmm-forge.js"></script>
<script src="src/nn-forge.js"></script>
<script src="src/attn-forge.js"></script>
<script src="src/qlearn-forge.js"></script>
<script>
(function () {
  'use strict';
  var MODULES = [
    ['L0 数学内核', window.MathForge],
    ['L1 监督·线性回归', window.LinRegForge],
    ['L1 监督·逻辑回归', window.LogRegForge],
    ['L1 监督·决策树 CART', window.TreeForge],
    ['L2 无监督·PCA', window.PCAForge],
    ['L2 无监督·K-Means', window.KMeansForge],
    ['L2 无监督·GMM/EM', window.GMMForge],
    ['L4 深度学习·MLP', window.NNForge],
    ['L5 注意力·Transformer', window.AttnForge],
    ['L6 强化学习·Q-Learning', window.QLForge]
  ];

  var ARCH = [
    ['L0 数学内核', 1], ['L1 监督学习', 1], ['L2 无监督学习', 1], ['L3 概率图模型', 0.5],
    ['L4 深度学习', 1], ['L5 序列/注意力', 1], ['L6 强化学习', 1], ['L7 生成模型', 0],
    ['L8 大模型系统', 0], ['L9 应用与评测', 0]
  ];

  function fmt(v) {
    if (v === 0) return '0';
    if (Math.abs(v) < 1e-4 || Math.abs(v) >= 1e12) return v.toExponential(2);
    if (Number.isInteger(v)) return String(v);
    return v.toFixed(6);
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var archEl = document.getElementById('arch');
  archEl.innerHTML = ARCH.map(function (a) {
    var cls = a[1] === 1 ? 'chip on' : (a[1] === 0.5 ? 'chip half' : 'chip');
    return '<span class="' + cls + '">' + a[0] + (a[1] === 1 ? ' ✓ 已锻造' : (a[1] === 0.5 ? ' 待并入' : ' 规划中')) + '</span>';
  }).join('');

  // 初始骨架
  var listEl = document.getElementById('list');
  function renderSkeleton() {
    listEl.innerHTML = MODULES.map(function (m, i) {
      return '<div class="mod" id="mod' + i + '">' +
        '<div class="hd"><span class="t">' + esc(m[0]) + '</span>' +
        '<span class="m">待运行</span></div>' +
        '<table><tr class="pending"><td class="n">尚未运行自检</td></tr></table></div>';
    }).join('');
  }

  function render(i, r) {
    var el = document.getElementById('mod' + i);
    var ok = r.checks.filter(function (c) { return c.ok; }).length;
    el.querySelector('.hd .m').innerHTML =
      '<span class="badge ' + (r.pass ? 'ok">PASS' : 'bad">FAIL') + '</span> ' + ok + '/' + r.checks.length;
    el.querySelector('table').innerHTML = r.checks.map(function (c) {
      return '<tr><td class="s">' + (c.ok ? '✅' : '❌') + '</td>' +
        '<td class="n">' + esc(c.name) + '</td>' +
        '<td class="v">' + fmt(c.value) + '</td>' +
        '<td class="t">' + (c.mode === 'ge' ? '≥ ' : '≤ ') + fmt(c.tol) + '</td></tr>';
    }).join('');
  }

  function run() {
    var btn = document.getElementById('run');
    var st = document.getElementById('status');
    btn.disabled = true;
    st.textContent = '正在运行全部自检…';
    renderSkeleton();

    var passMods = 0, passChecks = 0, total = 0, t0 = Date.now();
    MODULES.forEach(function (m, i) {
      // 让出主线程，保证界面可刷新
      setTimeout(function () {
        var r;
        try {
          r = m[1].selfTest();
        } catch (e) {
          r = { pass: false, checks: [{ name: '模块异常：' + e.message, value: 1, tol: 0, mode: 'le', ok: false }] };
        }
        render(i, r);
        total += r.checks.length;
        passChecks += r.checks.filter(function (c) { return c.ok; }).length;
        if (r.pass) passMods++;

        if (i === MODULES.length - 1) {
          document.getElementById('s-mod').textContent = passMods + ' / ' + MODULES.length;
          document.getElementById('s-chk').textContent = passChecks + ' / ' + total;
          var el = document.getElementById('s-all');
          if (passMods === MODULES.length && passChecks === total) {
            el.innerHTML = '<span class="badge ok">全绿</span>';
          } else {
            el.innerHTML = '<span class="badge bad">有失败</span>';
          }
          st.textContent = '自检完成，用时 ' + (Date.now() - t0) + ' ms（纯本地计算）';
          btn.disabled = false;
        }
      }, i * 20);
    });
  }

  document.getElementById('run').addEventListener('click', run);
  renderSkeleton();
  run();
})();
</script>
</body>
</html>

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-ai"
version = "1.0.0"
description = "世界级 AI 算法内核：从零手写 · 数学不变量可验证 · 与顶级开源交叉验证"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "晨星", email = "CJX0712@users.noreply.github.com" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
verify = ["scikit-learn>=1.3", "scipy>=1.10"]

[tool.setuptools]
packages = ["forge_ai"]
